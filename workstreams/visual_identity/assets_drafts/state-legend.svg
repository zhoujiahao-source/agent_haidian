<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="t d"><title id="t">Jing-Zhang complete semantic state legend</title><desc id="d">Four independent systems: evidence provenance, spatial design status, experiment outcome and risk authorization. Every status has text and non-color redundancy.</desc><defs><pattern id="derived" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#17212B" stroke-opacity=".20" stroke-width="2"/></pattern><pattern id="assumed" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#17212B" fill-opacity=".28"/></pattern></defs><rect width="1400" height="840" fill="#FFFFFF"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" fill="#17212B"><text x="60" y="62" font-size="30" font-weight="700">SEMANTIC LEGEND / 语义图例</text><text x="60" y="94" font-size="16" fill="#52616F">Four systems stay independent. Color is secondary to shape, line, pattern and text.</text><text x="60" y="142" font-size="22" font-weight="700">1 · EVIDENCE / 证据 — How do we know?</text><g font-size="16"><rect x="60" y="166" width="120" height="50" fill="none" stroke="#17212B" stroke-width="5"/><rect x="68" y="174" width="104" height="34" fill="none" stroke="#17212B" stroke-width="2"/><text x="192" y="197">O · OFFICIAL</text><rect x="330" y="166" width="120" height="50" fill="#F5F7F8" stroke="#17212B" stroke-width="3"/><text x="462" y="197">V · VERIFIED</text><rect x="600" y="166" width="120" height="50" fill="url(#derived)" stroke="#17212B" stroke-width="3"/><text x="732" y="197">D · DERIVED</text><rect x="870" y="166" width="120" height="50" fill="url(#assumed)" stroke="#17212B" stroke-width="3" stroke-dasharray="12 7"/><text x="1002" y="197">A · ASSUMED</text><rect x="1190" y="166" width="80" height="50" fill="none" stroke="#52616F" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><text x="1282" y="197">? UNKNOWN</text></g><text x="60" y="286" font-size="22" font-weight="700">2 · DESIGN / 图纸 — What spatial statement is shown?</text><g font-size="16"><line x1="60" y1="328" x2="210" y2="328" stroke="#17212B" stroke-width="5"/><text x="224" y="334">K · KNOWN</text><line x1="390" y1="328" x2="540" y2="328" stroke="#17212B" stroke-width="5" stroke-dasharray="22 12"/><text x="554" y="334">E · ESTIMATED</text><line x1="760" y1="328" x2="910" y2="328" stroke="#2463A6" stroke-width="8"/><path d="M895 316l22 12-22 12z" fill="#2463A6"/><text x="930" y="334">P · PROPOSED</text><line x1="1130" y1="328" x2="1280" y2="328" stroke="#52616F" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/><text x="1294" y="334">? UNKNOWN</text></g><text x="60" y="420" font-size="22" font-weight="700">3 · EXPERIMENT / 实验 — What did review decide?</text><g font-size="16"><rect x="60" y="446" width="96" height="50" fill="none" stroke="#52616F" stroke-width="3" stroke-dasharray="7 6"/><text x="170" y="477">TEST</text><rect x="300" y="446" width="96" height="50" fill="none" stroke="#8A3F52" stroke-width="7"/><path d="M320 462h56M320 480h56" stroke="#8A3F52" stroke-width="3"/><text x="410" y="477">STOP</text><rect x="540" y="446" width="96" height="50" fill="none" stroke="#8A6428" stroke-width="4" stroke-dasharray="12 6"/><path d="M560 472h56" stroke="#8A6428" stroke-width="3"/><text x="650" y="477">MODIFY</text><rect x="820" y="446" width="96" height="50" fill="none" stroke="#2E6F73" stroke-width="4"/><path d="M844 471h48" stroke="#2E6F73" stroke-width="4"/><path d="M884 463l12 8-12 8z" fill="#2E6F73"/><text x="930" y="477">CONTINUE</text><rect x="1140" y="446" width="96" height="50" fill="none" stroke="#365E9D" stroke-width="6"/><rect x="1148" y="454" width="80" height="34" fill="none" stroke="#365E9D" stroke-width="2"/><text x="1250" y="477">SCALE</text></g><text x="60" y="574" font-size="22" font-weight="700">4 · RISK / 风险 — What authorization level is required?</text><g font-size="16"><path d="M60 606h80v46c0 28-40 46-40 46s-40-18-40-46z" fill="none" stroke="#17212B" stroke-width="2"/><text x="160" y="658">R1 · LOW — reversible / routine approval</text><path d="M570 606h80v46c0 28-40 46-40 46s-40-18-40-46z" fill="none" stroke="#17212B" stroke-width="5"/><path d="M586 632h48" stroke="#17212B" stroke-width="3"/><text x="670" y="658">R2 · MEDIUM — professional approval</text><path d="M1080 604l50 92h-100z" fill="none" stroke="#17212B" stroke-width="7"/><text x="1150" y="658">R3 · HIGH — strict authorization</text></g><line x1="60" y1="752" x2="1340" y2="752" stroke="#DCE2E6" stroke-width="2"/><text x="60" y="786" font-size="15" fill="#52616F">Rule: never infer evidence quality, design status, experiment outcome or risk level from another system's color.</text><text x="60" y="814" font-size="15" fill="#52616F">Print rule: every critical state remains distinguishable when converted to grayscale.</text></g></svg>