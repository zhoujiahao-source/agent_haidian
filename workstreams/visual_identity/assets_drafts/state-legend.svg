<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Jing-Zhang semantic state legend draft</title><desc id="d">Four distinct groups for evidence status, design status, experiment state and risk.</desc><rect width="1200" height="660" fill="#FFFFFF"/><g font-family="Arial, sans-serif" fill="#17212B"><text x="60" y="62" font-size="30" font-weight="700">SEMANTIC LEGEND / 语义图例</text><text x="60" y="118" font-size="22" font-weight="700">1 · EVIDENCE — How do we know?</text><g font-size="18"><rect x="60" y="145" width="150" height="54" fill="none" stroke="#17212B" stroke-width="5"/><rect x="66" y="151" width="138" height="42" fill="none" stroke="#17212B" stroke-width="2"/><text x="225" y="180">O · OFFICIAL</text><rect x="430" y="145" width="150" height="54" fill="#F5F7F8" stroke="#17212B" stroke-width="3"/><text x="595" y="180">V · VERIFIED</text><rect x="800" y="145" width="150" height="54" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="12 7"/><text x="965" y="180">A · ASSUMED</text></g><text x="60" y="254" font-size="22" font-weight="700">2 · DESIGN — What spatial statement?</text><g font-size="18"><line x1="60" y1="292" x2="210" y2="292" stroke="#17212B" stroke-width="4"/><text x="225" y="299">K · KNOWN</text><line x1="430" y1="292" x2="580" y2="292" stroke="#17212B" stroke-width="4" stroke-dasharray="22 12"/><text x="595" y="299">E · ESTIMATED</text><line x1="800" y1="292" x2="950" y2="292" stroke="#2463A6" stroke-width="7"/><text x="965" y="299">P · PROPOSED</text></g><text x="60" y="374" font-size="22" font-weight="700">3 · EXPERIMENT — What did review decide?</text><g font-size="18"><rect x="60" y="402" width="82" height="48" fill="none" stroke="#52616F" stroke-width="3" stroke-dasharray="7 6"/><text x="158" y="434">TEST</text><rect x="300" y="402" width="82" height="48" fill="none" stroke="#8A3F52" stroke-width="6"/><text x="398" y="434">STOP</text><rect x="540" y="402" width="82" height="48" fill="none" stroke="#8A6428" stroke-width="3" stroke-dasharray="12 6"/><text x="638" y="434">MODIFY</text><rect x="820" y="402" width="82" height="48" fill="none" stroke="#365E9D" stroke-width="5"/><rect x="827" y="409" width="68" height="34" fill="none" stroke="#365E9D" stroke-width="2"/><text x="918" y="434">SCALE</text></g><text x="60" y="524" font-size="22" font-weight="700">4 · RISK — What authorization level?</text><g font-size="18"><path d="M60 550h70v42c0 26-35 42-35 42s-35-16-35-42z" fill="none" stroke="#17212B" stroke-width="2"/><text x="148" y="594">R1 LOW</text><path d="M390 550h70v42c0 26-35 42-35 42s-35-16-35-42z" fill="none" stroke="#17212B" stroke-width="5"/><text x="478" y="594">R2 MEDIUM</text><path d="M760 548l45 82h-90z" fill="none" stroke="#17212B" stroke-width="6"/><text x="830" y="594">R3 HIGH</text></g></g></svg>