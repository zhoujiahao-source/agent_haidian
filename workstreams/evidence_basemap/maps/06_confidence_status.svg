<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#111"><text x="60" y="60" font-size="30" font-weight="700">Known / Estimated / Proposed / Unknown 数据置信度图</text><text x="60" y="92" font-size="16">Never encode certainty by color alone</text><g transform="translate(90 155)"><rect x="0" y="0" width="1020" height="105" fill="#fafafa" stroke="#111" stroke-width="3"/><text x="25" y="38" font-size="22" font-weight="700">Known</text><line x1="160" y1="50" x2="300" y2="50" stroke="#111" stroke-width="6"/><text x="330" y="38" font-size="16">Official/Verified facts within source scope</text><text x="330" y="68" font-size="14">Examples: official scale values; 9 km park framework; 2026 update projects</text><rect x="0" y="140" width="1020" height="105" fill="white" stroke="#555" stroke-width="3" stroke-dasharray="12 8"/><text x="25" y="178" font-size="22" font-weight="700">Estimated</text><line x1="160" y1="190" x2="300" y2="190" stroke="#555" stroke-width="5" stroke-dasharray="12 8"/><text x="330" y="178" font-size="16">Derived/provisional geometry with method + source + limitation</text><text x="330" y="208" font-size="14">Example: repository rough SITE_BOUNDARY / KEY_AREA placeholders</text><rect x="0" y="280" width="1020" height="105" fill="white" stroke="#111" stroke-width="2"/><text x="25" y="318" font-size="22" font-weight="700">Proposed</text><circle cx="220" cy="330" r="18" fill="white" stroke="#111" stroke-width="3"/><text x="330" y="318" font-size="16">Future design suggestion only — never Existing</text><text x="330" y="348" font-size="14">Scenario/landmark/service-node proposals belong to design agents</text><rect x="0" y="420" width="1020" height="105" fill="white" stroke="#777" stroke-width="2"/><text x="25" y="458" font-size="22" font-weight="700">Unknown</text><text x="190" y="468" font-size="46">?</text><text x="330" y="458" font-size="16">Material fact not supported by current public/cleared evidence</text><text x="330" y="488" font-size="14">Official polygons, FAR/height/setbacks, ownership, heritage GIS, utilities...</text></g><text x="60" y="750" font-size="14">Data classes: Official / Verified / Derived / Assumed / Unknown. Drawing classes: Known / Estimated / Proposed / Unknown.</text></g></svg>