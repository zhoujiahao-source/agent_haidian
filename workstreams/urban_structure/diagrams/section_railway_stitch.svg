<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:27px;font-weight:bold}.b{font-size:15px}.box{fill:#f7f7f7;stroke:#222}.d{stroke:#666;stroke-dasharray:7 6}</style><text x="40" y="45" class="h">S1｜Railway / East-West Stitch Evidence Gate</text><text x="40" y="75" class="b">Conceptual section envelope. Prove crossing before designing bridge/tunnel/passage.</text><g class="b"><rect x="70" y="220" width="250" height="130" class="box"/><text x="90" y="280">west public route</text><rect x="320" y="220" width="170" height="130" class="box"/><text x="340" y="280">landing/buffer</text><rect x="490" y="220" width="190" height="130" class="box"/><text x="510" y="270">rail/road barrier</text><text x="510" y="295">EXISTING: verify</text><rect x="680" y="220" width="170" height="130" class="box"/><text x="700" y="280">safe crossing</text><rect x="850" y="220" width="280" height="130" class="box"/><text x="870" y="280">east public route</text></g><line x1="70" y1="380" x2="1130" y2="380" class="d"/><text x="80" y="430" class="b">• crossing must be lawful, physical and universally accessible</text><text x="80" y="460" class="b">• public route works without app or recognition</text><text x="80" y="490" class="b">• experiment never occupies the only clear route</text><text x="40" y="590" class="b">PROPOSED / dimensions are conceptual, not road redlines or engineering standards.</text></svg>