<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:27px;font-weight:bold}.b{font-size:15px}.box{fill:#f7f7f7;stroke:#222}</style><text x="40" y="45" class="h">ZZY-01｜Zhongzhiyuan Porous Verification Campus</text><text x="40" y="75" class="b">Public city edge → observation buffer → legible safety edge → controlled test → shared research frontage.</text><g class="b"><rect x="70" y="220" width="200" height="130" class="box"/><text x="88" y="280">public movement</text><rect x="270" y="220" width="190" height="130" class="box"/><text x="288" y="280">observation buffer</text><rect x="460" y="220" width="95" height="130" class="box"/><text x="470" y="270">safety</text><text x="470" y="295">edge</text><rect x="555" y="220" width="330" height="130" class="box"/><text x="575" y="280">controlled test envelope</text><rect x="885" y="220" width="245" height="130" class="box"/><text x="905" y="280">shared hall / lab edge</text></g><text x="80" y="430" class="b">• public can understand testing without entering the test zone</text><text x="80" y="460" class="b">• higher-impact pilot has explicit boundary, operator and manual stop</text><text x="80" y="490" class="b">• campus edge remains useful when no experiment is running</text></svg>