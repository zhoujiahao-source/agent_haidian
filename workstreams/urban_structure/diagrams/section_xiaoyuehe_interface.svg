<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:27px;font-weight:bold}.b{font-size:15px}.box{fill:#f7f7f7;stroke:#222}</style><text x="40" y="45" class="h">S2｜Xiaoyuehe Blue-Green Public Capability Interface</text><text x="40" y="75" class="b">Permanent ecological/public value first; digital layer remains optional and low-risk.</text><g class="b"><rect x="70" y="220" width="180" height="130" class="box"/><text x="90" y="280">urban edge</text><rect x="250" y="220" width="170" height="130" class="box"/><text x="270" y="280">accessible path</text><rect x="420" y="220" width="220" height="130" class="box"/><text x="440" y="280">shade / seating</text><rect x="640" y="220" width="250" height="130" class="box"/><text x="660" y="280">ecological buffer</text><rect x="890" y="220" width="240" height="130" class="box"/><text x="910" y="270">water / park edge</text><text x="910" y="295">EXISTING: verify</text></g><text x="80" y="430" class="b">• shade, ecology, infiltration and accessible public life remain useful with AI off</text><text x="80" y="460" class="b">• ambient sensing/advice uses lawful aggregate data only</text><text x="80" y="490" class="b">• sensor-light refuge and manual maintenance route remain available</text></svg>