<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:27px;font-weight:bold}.b{font-size:15px}.box{fill:#f7f7f7;stroke:#222}</style><text x="40" y="45" class="h">DZS-01｜Dazhongsi Transit-Market Service Commons</text><text x="40" y="75" class="b">Transit + daily commerce + culture + night activity; not an enclosed AI mall.</text><g class="b"><rect x="70" y="220" width="265" height="130" class="box"/><text x="90" y="280">movement / waiting</text><rect x="335" y="220" width="270" height="130" class="box"/><text x="355" y="280">flexible spill-out</text><rect x="605" y="220" width="220" height="130" class="box"/><text x="625" y="270">service / recovery</text><text x="625" y="295">prototype bay</text><rect x="825" y="220" width="305" height="130" class="box"/><text x="845" y="280">existing commercial frontage</text></g><text x="80" y="430" class="b">• public passes without agreeing to data collection</text><text x="80" y="460" class="b">• visible human recovery path when prototype fails</text><text x="80" y="490" class="b">• night layer protects waiting, lighting and safe return route</text></svg>