name: Validate final City OS v2 with latest upstream tools

on:
  push:
    branches:
      - integration/final-city-os-v2
    paths:
      - '.github/workflows/validate-final-city-os-v2.yml'
      - 'workstreams/integration/repair_v2.py'
      - 'workstreams/integration/refresh_manifest_v2.py'
      - 'workstreams/integration/validation-trigger/**'

permissions:
  contents: write

jobs:
  validate-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair tools
        uses: actions/checkout@v4
        with:
          ref: integration/final-city-os-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            workstreams/integration/repair_v2.py
            workstreams/integration/refresh_manifest_v2.py
          path: tools

      - name: Checkout clean submission workspace
        uses: actions/checkout@v4
        with:
          ref: submission/zhoujiahao-source/jingzhang-urban-capability-exchange-v2
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            brief
            data
            docs
            skills
            scenarios
            tracks.json
            submissions/zhoujiahao-source/jingzhang-legible-ai-belt
            requirements-review.txt
            pyproject.toml
          path: workspace

      - name: Add and fetch canonical upstream
        working-directory: workspace
        run: |
          git remote add upstream https://github.com/open-city-ai/haidian.git || true
          git fetch --filter=blob:none upstream main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install review dependencies
        working-directory: workspace
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-review.txt

      - name: Repair canonical package to current contract
        run: |
          python3 tools/workstreams/integration/repair_v2.py workspace/submissions/zhoujiahao-source/jingzhang-legible-ai-belt

      - name: Render canonical bilingual HTML
        working-directory: workspace
        run: |
          python3 scripts/render_proposal_html.py submissions/zhoujiahao-source/jingzhang-legible-ai-belt

      - name: Refresh manifest hashes before self-check
        run: |
          python3 tools/workstreams/integration/refresh_manifest_v2.py workspace/submissions/zhoujiahao-source/jingzhang-legible-ai-belt --self-checked false

      - name: Run contributor self-check
        working-directory: workspace
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/self_check_submission.py submissions/zhoujiahao-source/jingzhang-legible-ai-belt --pr-author zhoujiahao-source --json | tee /tmp/self-check.json

      - name: Mark self-check successful and commit canonical refresh
        run: |
          python3 tools/workstreams/integration/refresh_manifest_v2.py workspace/submissions/zhoujiahao-source/jingzhang-legible-ai-belt --self-checked true
          cd workspace
          git config user.name 'City OS v2 Validator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A submissions/zhoujiahao-source/jingzhang-legible-ai-belt
          git commit -m 'fix(submission): align City OS v2 with latest deterministic validator'
          git push origin HEAD:submission/zhoujiahao-source/jingzhang-urban-capability-exchange-v2

      - name: Run participant preflight
        working-directory: workspace
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/participant_preflight.py submissions/zhoujiahao-source/jingzhang-legible-ai-belt --pr-author zhoujiahao-source --check-push | tee /tmp/preflight.log

      - name: Print final branch head
        working-directory: workspace
        run: |
          git rev-parse HEAD
          git status --short
