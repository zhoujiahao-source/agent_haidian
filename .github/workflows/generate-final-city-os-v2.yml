name: Generate final City OS v2

on:
  push:
    branches:
      - integration/final-city-os-v2
    paths:
      - 'workstreams/integration/generator_parts/**'
      - '.github/workflows/generate-final-city-os-v2.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout lightweight integration workspace
        uses: actions/checkout@v4
        with:
          ref: integration/final-city-os-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            workstreams/integration/generator_parts
            submissions/zhoujiahao-source/jingzhang-legible-ai-belt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-arphic-gbsn00lp poppler-utils

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install shapely pyproj matplotlib reportlab mistune pillow

      - name: Reconstruct generator
        run: |
          cat workstreams/integration/generator_parts/part_*.txt > /tmp/generate_v2.py
          python -m py_compile /tmp/generate_v2.py

      - name: Generate complete canonical package
        env:
          JZ_OUT: submissions/zhoujiahao-source/jingzhang-legible-ai-belt
        run: python /tmp/generate_v2.py

      - name: Sanity-check generated package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('submissions/zhoujiahao-source/jingzhang-legible-ai-belt')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.geojson'):
              json.loads(p.read_text(encoding='utf-8'))
          required=['proposal.md','proposal.en.md','visual/index.html','visual/index.en.html','drawings/a3-booklet.pdf','drawings/a3-booklet.en.pdf','drawings/a0-boards.pdf','drawings/a0-boards.en.pdf']
          for r in required:
              assert (root/r).exists(), r
          print('sanity pass; files=',sum(1 for p in root.rglob('*') if p.is_file()))
          PY
          pdfinfo submissions/zhoujiahao-source/jingzhang-legible-ai-belt/drawings/a3-booklet.pdf | grep '^Pages:'
          pdfinfo submissions/zhoujiahao-source/jingzhang-legible-ai-belt/drawings/a0-boards.pdf | grep '^Pages:'
          test $(stat -c%s submissions/zhoujiahao-source/jingzhang-legible-ai-belt/assets/figures/site-overview.png) -gt 10000
          test $(stat -c%s submissions/zhoujiahao-source/jingzhang-legible-ai-belt/drawings/a3-booklet.pdf) -gt 10000

      - name: Commit generated canonical package
        run: |
          git config user.name 'City OS v2 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A submissions/zhoujiahao-source/jingzhang-legible-ai-belt
          if git diff --cached --quiet; then
            echo 'Canonical package already current.'
          else
            git commit -m 'build(submission): regenerate Jing-Zhang City OS v2 package'
            git push origin HEAD:integration/final-city-os-v2
          fi
