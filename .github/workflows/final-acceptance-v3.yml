name: Final Acceptance v3

on:
  push:
    branches:
      - integration/final-acceptance-v3
    paths:
      - '.github/workflows/final-acceptance-v3.yml'
      - 'workstreams/final_acceptance_v3/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance workstream
        uses: actions/checkout@v4
        with:
          ref: integration/final-acceptance-v3
          fetch-depth: 1
          sparse-checkout: |
            workstreams/final_acceptance_v3
            .github/workflows/final-acceptance-v3.yml

      - name: Build and validate 100-item acceptance matrix
        env:
          ALLOW_AGENT_OPEN: "1"
        run: |
          python workstreams/final_acceptance_v3/build_acceptance_matrix.py
          python workstreams/final_acceptance_v3/validate_acceptance.py

      - name: Resolve latest upstream and guard audited rules
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUDITED="6405afe0ce1f23e1b7056e30c0fe12fe3c59ecab"
          LATEST="$(git ls-remote https://github.com/open-city-ai/haidian.git refs/heads/main | cut -f1)"
          echo "audited=$AUDITED"
          echo "latest=$LATEST"
          if [ "$LATEST" != "$AUDITED" ]; then
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/open-city-ai/haidian/compare/${AUDITED}...${LATEST}" \
              > /tmp/compare.json
            python - <<'PY'
          import json, sys
          d=json.load(open('/tmp/compare.json',encoding='utf-8'))
          files=[x['filename'] for x in d.get('files',[])]
          non=[f for f in files if not (f.startswith('submissions/') or f=='submissions-data.js')]
          print(f"Upstream commits since audited baseline: {d.get('ahead_by')}")
          print(f"Changed files returned by compare API: {len(files)}")
          if non:
              print('Rule/tool/source changes require re-audit:', file=sys.stderr)
              print('\n'.join(non), file=sys.stderr)
              raise SystemExit(1)
          print('Returned changes are peer submissions/gallery only; audited rules remain valid.')
          PY
          fi
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Checkout latest upstream validation workspace
        uses: actions/checkout@v4
        with:
          repository: open-city-ai/haidian
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          fetch-depth: 1
          sparse-checkout: |
            scripts
            requirements-review.txt
            brief/site-package
            data/source_registry.json
            docs/data-workflow.md
            scenarios
            tracks

      - name: Checkout formal submission branch
        uses: actions/checkout@v4
        with:
          ref: submission/zhoujiahao-source/jingzhang-urban-capability-exchange-v3-final
          path: formal
          fetch-depth: 0
          sparse-checkout: |
            submissions/zhoujiahao-source/jingzhang-legible-ai-belt

      - name: Install latest review requirements
        run: python -m pip install -r upstream/requirements-review.txt

      - name: Prepare submission inside latest upstream workspace
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/formal/submissions/zhoujiahao-source/jingzhang-legible-ai-belt"
          DST="$GITHUB_WORKSPACE/upstream/submissions/zhoujiahao-source/jingzhang-legible-ai-belt"
          mkdir -p "$(dirname "$DST")"
          cp -a "$SRC" "$DST"
          git -C upstream fetch origin main:refs/remotes/origin/main --depth=1
          git -C upstream switch -c validation/zhoujiahao-source

      - name: Render canonical bilingual HTML and refresh manifest hashes
        shell: bash
        run: |
          set -euo pipefail
          SUB="$GITHUB_WORKSPACE/upstream/submissions/zhoujiahao-source/jingzhang-legible-ai-belt"
          python upstream/scripts/render_proposal_html.py "$SUB"
          SUB="$SUB" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['SUB'])
          path=root/'manifest.json'
          m=json.loads(path.read_text(encoding='utf-8'))
          for item in m.get('files',[]):
              if not isinstance(item,dict):
                  continue
              rel=item.get('path')
              if not rel or rel=='manifest.json':
                  continue
              p=root/rel
              if p.is_file():
                  item['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          claim=m.get('validation_claim')
          if isinstance(claim,dict):
              claim['self_checked']=True
          path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run latest contributor self-check
        shell: bash
        working-directory: upstream
        run: |
          set +e
          python scripts/self_check_submission.py \
            submissions/zhoujiahao-source/jingzhang-legible-ai-belt \
            --pr-author zhoujiahao-source \
            --json > /tmp/final-self-check.json 2>/tmp/final-self-check.stderr
          RC=$?
          set -e
          cat /tmp/final-self-check.json || true
          cat /tmp/final-self-check.stderr || true
          if [ "$RC" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/final-self-check.json')
          msgs=[]
          if p.exists() and p.read_text(encoding='utf-8').strip():
              d=json.loads(p.read_text(encoding='utf-8'))
              msgs.extend(d.get('next_actions') or [])
              for section in ['deterministic_validation','spatial_review','visual_review','professional_review']:
                  s=d.get(section) or {}
                  err=str(s.get('stderr') or '').strip()
                  if err:
                      msgs.append(f'{section}: {err}')
                  out=s.get('stdout')
                  if isinstance(out,dict):
                      for e in out.get('errors') or []:
                          msgs.append(f'{section}: {e}')
                      for issue in out.get('issues') or []:
                          if isinstance(issue,dict) and issue.get('severity') in {'blocking','major'}:
                              msgs.append(f"{section} {issue.get('check_id','ISSUE')}: {issue.get('message','')}")
          stderr=Path('/tmp/final-self-check.stderr')
          if stderr.exists() and stderr.read_text(encoding='utf-8').strip():
              msgs.append('self_check stderr: '+stderr.read_text(encoding='utf-8').strip())
          seen=set()
          for msg in msgs or ['self_check_submission.py failed without a parsed diagnostic']:
              msg=' '.join(str(msg).split())
              if msg in seen:
                  continue
              seen.add(msg)
              print(f'::error title=Latest self-check::{msg}')
          PY
            exit "$RC"
          fi

      - name: Run latest participant preflight
        shell: bash
        working-directory: upstream
        run: |
          set +e
          python scripts/participant_preflight.py \
            submissions/zhoujiahao-source/jingzhang-legible-ai-belt \
            --pr-author zhoujiahao-source \
            --json > /tmp/final-preflight.json 2>/tmp/final-preflight.stderr
          RC=$?
          set -e
          cat /tmp/final-preflight.json || true
          cat /tmp/final-preflight.stderr || true
          if [ "$RC" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          msgs=[]
          p=Path('/tmp/final-preflight.json')
          if p.exists() and p.read_text(encoding='utf-8').strip():
              d=json.loads(p.read_text(encoding='utf-8'))
              msgs.extend(d.get('blockers') or [])
              msgs.extend(d.get('warnings') or [])
          err=Path('/tmp/final-preflight.stderr')
          if err.exists() and err.read_text(encoding='utf-8').strip():
              msgs.append(err.read_text(encoding='utf-8').strip())
          for msg in dict.fromkeys(' '.join(str(x).split()) for x in (msgs or ['participant_preflight.py failed'])):
              print(f'::error title=Latest preflight::{msg}')
          PY
            exit "$RC"
          fi

      - name: Copy validated generated files back to formal branch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/upstream/submissions/zhoujiahao-source/jingzhang-legible-ai-belt"
          DST="$GITHUB_WORKSPACE/formal/submissions/zhoujiahao-source/jingzhang-legible-ai-belt"
          cp -a "$SRC/report/proposal.html" "$DST/report/proposal.html"
          cp -a "$SRC/report/proposal.en.html" "$DST/report/proposal.en.html"
          cp -a "$SRC/manifest.json" "$DST/manifest.json"

      - name: Commit generated formal refresh
        id: formalcommit
        shell: bash
        working-directory: formal
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/zhoujiahao-source/jingzhang-legible-ai-belt
          if git diff --cached --quiet; then
            echo "No generated formal changes."
          else
            git commit -m "Finalize v3 acceptance against upstream ${UPSTREAM_SHA:0:8}"
            git push origin HEAD:submission/zhoujiahao-source/jingzhang-urban-capability-exchange-v3-final
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close final Agent-executable acceptance item
        env:
          FORMAL_SHA: ${{ steps.formalcommit.outputs.sha }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          criteria=Path("workstreams/final_acceptance_v3/criteria/competition_delivery.json")
          d=json.loads(criteria.read_text(encoding="utf-8"))
          for item in d["items"]:
              if item["id"]=="EX-013":
                  item["status"]="COMPLETE"
                  item["notes"]="Latest upstream render/self-check/preflight completed successfully in GitHub Actions; ready-for-review package hashes were refreshed without re-running scaffold-only finalization."
                  item["evidence_refs"]=["GitHub Actions final-acceptance-v3", "manifest.json", "self_check.json"]
          criteria.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python workstreams/final_acceptance_v3/build_acceptance_matrix.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("workstreams/final_acceptance_v3/acceptance_matrix.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["validated_upstream_sha"]=os.environ["UPSTREAM_SHA"]
          d["validated_formal_sha"]=os.environ["FORMAL_SHA"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          rp=Path("workstreams/final_acceptance_v3/README.md")
          t=rp.read_text(encoding="utf-8")
          t=t.replace("- COMPLETE: 86\n- IN_PROGRESS: 1 (`EX-013`: latest-upstream render/finalize/self-check/preflight)\n- BLOCKED_OFFICIAL_DATA: 3\n- HUMAN_REQUIRED: 10",
                      "- COMPLETE: 87\n- IN_PROGRESS: 0\n- BLOCKED_OFFICIAL_DATA: 3\n- HUMAN_REQUIRED: 10")
          if "## Latest successful validation" not in t:
              t += f"\n## Latest successful validation\n\n- Upstream: `{os.environ['UPSTREAM_SHA']}`\n- Formal branch SHA: `{os.environ['FORMAL_SHA']}`\n- Agent-executable acceptance items remaining: **0**\n"
          rp.write_text(t,encoding="utf-8")
          PY

      - name: Run strict 100-item acceptance validator
        run: python workstreams/final_acceptance_v3/validate_acceptance.py

      - name: Commit finalized acceptance ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workstreams/final_acceptance_v3
          git commit -m "[acceptance-finalized] Close Agent-executable v3 acceptance"
          git push origin HEAD:integration/final-acceptance-v3
