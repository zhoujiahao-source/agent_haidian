name: Live OSM Microsoft basemap cross-check v2

on:
  push:
    branches:
      - integration/final-city-os-v2
    paths:
      - 'workstreams/evidence_basemap/run_live_crosscheck.py'
      - 'workstreams/evidence_basemap/probe_ms_index.py'
      - '.github/workflows/live-basemap-crosscheck-v2.yml'

permissions:
  contents: write

jobs:
  basemap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration evidence workspace
        uses: actions/checkout@v4
        with:
          ref: integration/final-city-os-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            workstreams/evidence_basemap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spatial audit dependencies
        run: pip install shapely pyproj

      - name: Execute live retrieval and cross-check
        env:
          JZ_BASEMAP_OUT: workstreams/evidence_basemap/live_2026-08-09
        run: |
          python3 workstreams/evidence_basemap/run_live_crosscheck.py
          python3 workstreams/evidence_basemap/probe_ms_index.py

      - name: Sanity check evidence outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('workstreams/evidence_basemap/live_2026-08-09')
          d=json.loads((root/'crosscheck_summary.json').read_text())
          p=json.loads((root/'ms_index_probe.json').read_text())
          assert d['status']=='live_executed'
          assert d['osm']['http_status']==200
          assert p['http_status']==200
          assert root.joinpath('osm_buildings.geojson').is_file()
          assert root.joinpath('microsoft_buildings.geojson').is_file()
          print(json.dumps({'crosscheck':d,'ms_index_probe':p},ensure_ascii=False,indent=2))
          PY

      - name: Commit live evidence snapshot
        run: |
          git config user.name 'City OS v2 Basemap Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add workstreams/evidence_basemap/live_2026-08-09
          git commit -m 'data(v2): verify live OSM and Microsoft partition evidence'
          git push origin HEAD:integration/final-city-os-v2
